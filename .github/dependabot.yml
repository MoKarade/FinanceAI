# Mises à jour de dépendances proposées automatiquement (porte sécurité de l'Atelier, S6).
# Groupées pour limiter le bruit : une PR par semaine pour les versions mineures/correctives.
# Chaque PR passe par la CI complète (gate, E2E, qualité, sécurité) et fusionne seule si tout
# est vert — fusion-auto.yml couvre aussi Dependabot.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # @types/node suit la MAJEURE de Node déclarée (engines, .nvmrc) : la garde
      # [ENV-NODE-NON-DECLARE] exige les trois alignés. Une majeure de types plus récente ne peut
      # que rougir (vécu : #1015, @types/node 26 sur Node 24) — elle se change AVEC Node, pas seule.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
