name: backlog-autocheck

# Coche docs/BACKLOG.md automatiquement à partir des [ID] en tête des messages de
# commit qui arrivent sur main (cf CLAUDE.md « cochage AUTOMATIQUE »).
on:
  push:
    branches: [main]

permissions:
  contents: write

# Une seule exécution à la fois : deux pushes rapprochés ne se battent pas sur le push retour.
concurrency:
  group: backlog-autocheck
  cancel-in-progress: false

jobs:
  autocheck:
    # Ne pas réagir à son PROPRE commit de cochage (ni à tout commit marqué) → pas de boucle.
    if: "!contains(github.event.head_commit.message, '[skip-backlog]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour lire la plage de commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Coche les items livrés
        run: node scripts/backlog-autocheck.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

      - name: Commit + push si BACKLOG a changé
        run: |
          if ! git diff --quiet -- docs/BACKLOG.md; then
            git config user.name "backlog-autocheck[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/BACKLOG.md
            git commit -m "docs(backlog): coche les items livrés [skip-backlog]"
            git push
          else
            echo "Rien à cocher."
          fi
