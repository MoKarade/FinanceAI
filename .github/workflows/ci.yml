name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `cache: 'npm'` ici car ce parametre exige un lock file
      # (package-lock.json ou yarn.lock). Le lock a ete retire du repo
      # au commit 97651b54 pour eviter les desyncs. A reactiver une fois
      # un lock propre regenere et commite.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
