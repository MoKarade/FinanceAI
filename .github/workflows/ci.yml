name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm install (au lieu de npm ci) car package-lock.json n'est pas
      # systematiquement regenere apres chaque modif de package.json sur
      # cette branche. A ramener a `npm ci` une fois le lock file fixe
      # et le workflow stabilise.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
