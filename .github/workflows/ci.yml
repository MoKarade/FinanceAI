name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `cache: 'npm'` car pas de lock dans le repo (commit 97651b54)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Typecheck reactive ! 3 fichiers fixes (utils/tax, Retirement, Settings).
      # 4 fichiers exclus temporairement de tsconfig (Dashboard, FutureProjection,
      # Investments, Transactions) - bugs preexistants documentes dans META_AUDIT.md
      # a fixer dans sprints futurs (sortir progressivement de l'exclude).
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
