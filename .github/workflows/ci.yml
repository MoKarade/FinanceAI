name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint / Typecheck / Tests / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `cache: 'npm'` : pas de package-lock.json commité dans ce repo
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Bloque sur erreurs ESLint (react-hooks/rules-of-hooks a cassé prod le 2026-05-22)
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      # Note : le script prebuild relance lint automatiquement via package.json
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium + deps système
        run: npx playwright install --with-deps chromium

      # playwright.config.ts démarre automatiquement `npm run dev` (port 3000)
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
