name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `cache: 'npm'` car pas de lock dans le repo (commit 97651b54)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Bloque les erreurs ESLint (notamment react-hooks/rules-of-hooks → React
      # #310 qui a cassé l'app en prod le 2026-05-22). Les warnings ne bloquent pas.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
