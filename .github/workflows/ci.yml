name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `cache: 'npm'` car pas de lock dans le repo (commit 97651b54)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # `npm run typecheck` est temporairement desactive : 15+ bugs de
      # typage preexistants (avant cette session) que la nouvelle CI a
      # reveles dans :
      #   - components/Dashboard.tsx (currentValue/mortgageBalance sur RealEstateGoal)
      #   - components/FutureProjection.tsx (config.users inference never, etc.)
      #   - components/Investments.tsx (implicit any data)
      #   - components/Retirement.tsx (comparaison 'CELIAPP')
      #   - components/Settings.tsx (User[] vs [User, User])
      #   - components/Transactions.tsx (params implicit any)
      #   - utils/tax.ts (breakdown implicit any[])
      #   - utils/useFutureSimulation.ts (deja exclu)
      # A reactiver progressivement (sprint dedie : 1-2 fichiers / commit).
      # Voir AUDIT_REPORT.md et META_AUDIT.md pour le backlog.
      # - name: Typecheck
      #   run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
