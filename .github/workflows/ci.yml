name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# [S5-CODEQL] Moindre privilège (CodeQL actions/missing-workflow-permissions, 4 alertes) : aucun job de ce
# workflow n'écrit via le jeton (ni gh, ni commentaire, ni SARIF) — lecture seule pour tous.
permissions:
  contents: read

jobs:
  quality:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 10 min 12 s observe.
    timeout-minutes: 30
    name: Lint / Typecheck / Tests / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git
          # du runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris
          # une action tierce, peut le lire. Ce job ne pousse rien, donc il n'en a pas besoin.
          persist-credentials: false

      # La convention de compte-rendu est une COPIE synchronisée de
      # claude-config/conventions/COMPTE-RENDU.md — un CLAUDE.md ne charge rien hors de son
      # arbre, donc le renvoi seul ne chargerait rien. Une copie sans contrôle redevient une
      # variante locale en silence : c'est le mode de panne que ce pas rend bruyant.
      # Pour la faire évoluer : modifier la SOURCE, propager, mettre à jour cette empreinte.
      - name: La convention de compte-rendu n'a pas dérivé
        run: echo "97e36acba8770c9614b6295773267b9690d07bc5bcd130b3bc0d03da996ab62b  docs/COMPTE-RENDU.md" | sha256sum -c -

      # Pas de `cache: 'npm'` : pas de package-lock.json commité dans ce repo
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      # Bloque sur erreurs ESLint (react-hooks/rules-of-hooks a cassé prod le 2026-05-22)
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      # Note : le script prebuild relance lint automatiquement via package.json
      - name: Build
        run: npm run build

  e2e:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 4 min 03 s observe - Playwright, variance a l'installation.
    timeout-minutes: 30
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git
          # du runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris
          # une action tierce, peut le lire. Ce job ne pousse rien, donc il n'en a pas besoin.
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install Playwright Chromium + deps système
        # [CI-NPX-NO-INSTALL] `--no-install` : sans lui, `npx` TÉLÉCHARGE le paquet depuis le
        # registre quand il ne le trouve pas localement, puis exécute ses scripts de cycle de vie
        # — la surface que `--ignore-scripts` ferme à l'étape d'installation, rouverte ici, et sur
        # une version NON figée (le registre sert la dernière). Avec le drapeau, npx n'utilise que
        # le binaire de `node_modules/.bin`, donc la version qu'épingle le lockfile, et échoue
        # franchement s'il manque au lieu d'aller le chercher. Mesuré le 18/09 : `npx --no-install playwright --version` rend « Version 1.60.0 », le binaire local (`@playwright/test` est une devDependency).
        # ⚠️ Vérifié aussi que l'étape d'installation vit dans le MÊME job — sans elle, le drapeau
        # transformerait un téléchargement silencieux en échec.
        run: npx --no-install playwright install --with-deps chromium

      # playwright.config.ts démarre automatiquement `npm run dev` (port 3000)
      # test:e2e:ci exclut les tests @visual (screenshots) : la comparaison
      # pixel-à-pixel échoue en cross-platform (baselines Windows vs runner Linux).
      # Les screenshots restent un filet de régression VISUELLE en local.
      #
      # ⚠️ `--max-failures=2` EXISTE POUR QUE CE JOB PARLE. Sans lui, une suite qui échoue
      # LENTEMENT n'échoue pas : elle est COUPÉE au plafond de 30 min ci-dessus, et un job coupé
      # ressort `cancelled` — ni rouge ni vert — SANS JAMAIS IMPRIMER SON RÉSUMÉ. Mesuré le
      # 2026-09-21 sur trois runs d'affilée : 18 tests traités, zéro diagnostic lisible, et la
      # panne avait déjà survécu plusieurs merges pour cette seule raison.
      # L'arithmétique du plafond : `retries: 2` et les specs du Futur portent
      # `test.setTimeout(120_000)`, donc un test qui expire coûte jusqu'à 3 × 2 min = 6 min.
      # Deux échecs = ~12 min, plus les tests qui passent — on reste sous les 30 min AVEC le
      # rapport. Une suite SAINE n'est pas concernée : le drapeau ne mord qu'au 2ᵉ échec réel
      # (référence écrite plus haut : 4 min 03 s pour les 54 tests).
      # ⚠️ Ça ne désactive, ne saute ni ne met en quarantaine AUCUN test — ça borne le temps
      # qu'on accorde à une suite déjà cassée pour qu'elle dise POURQUOI.
      - name: Run E2E tests (fonctionnels — sans screenshots)
        run: npm run test:e2e:ci

      - name: Upload rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------------------
  # Portes qualité de l'Atelier (S6, 23/09/2026) — même dispositif que le pilote BatchChef.
  # Depuis la fusion automatique, une PR verte part en production sans relecture humaine :
  # ces deux jobs sont ce qui garantit qu'elle ne fait RECULER ni la qualité ni la sécurité.
  # Cliquet : qualite/seuils.json fige l'état au jour de la mise en place ; rien ne recule.
  qualite:
    # Calibré sur la mesure du 23/09/2026 (tests sous couverture ≈ 20 min sur 2 vCPU).
    timeout-minutes: 45
    name: Qualité (lint · couverture · code mort · architecture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Portes qualité (cliquet)
        run: node qualite/portes.mjs
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-qualite
          path: qualite/rapport.json
          if-no-files-found: ignore

  securite:
    # Secrets dans tout l'historique qui serait fusionné — main + la PR, via HEAD (gitleaks) — + analyse
    # statique du code (Semgrep). Les autres branches relèvent de l'audit, pas de la porte : sans
    # --log-opts, gitleaks lirait `--all` et une vieille branche ferait rougir une PR qui n'y touche pas.
    # Mesuré le 23/09/2026 : gitleaks 0 fuite sur l'historique complet ; Semgrep 0 résultat sur
    # le code (les 11 résultats « action épinglée par tag » des workflows sont hors périmètre,
    # .github exclu — durcissement séparé). Donc bloquant d'emblée (--error).
    timeout-minutes: 15
    name: Sécurité (secrets · analyse statique)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks lit l'historique complet, pas seulement le dernier commit
          persist-credentials: false
      # Binaire officiel, version et empreinte figées : un outil de sécurité téléchargé sans
      # vérification serait lui-même une surface d'attaque.
      - name: Secrets (gitleaks, historique complet)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --log-opts="--full-history HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Analyse statique (Semgrep)
        run: |
          # --only-binary : aucune compilation ni script d'installation, seulement des roues publiées.
          python -m pip install --quiet --only-binary :all: semgrep==1.177.0
          semgrep scan --metrics off --error --exclude .github \
            --config p/typescript --config p/react \
            --config p/secrets --config p/owasp-top-ten .
