name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer manuellement depuis l'onglet Actions
  workflow_dispatch:

# Permissions nécessaires pour publier sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement actif à la fois (annule les en-cours)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (avec base path /FinanceAI/ pour GitHub Pages)
        run: npm run build
        env:
          VITE_BASE_PATH: /FinanceAI/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
