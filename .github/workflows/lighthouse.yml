# P1.6 — Lighthouse CI audit perf + a11y + best-practices + SEO.
#
# Workflow séparé du CI critique pour ne pas bloquer Tests+Build.
# Tous les budgets sont en "warn" initialement — aucune assertion ne fail le job.
# Pour durcir, basculer les warn → error dans .lighthouserc.json.
#
# Résultats : artefact .html téléchargeable + lien temporary-public-storage.

name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
