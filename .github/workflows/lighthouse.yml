# P1.6 — Lighthouse CI audit perf + a11y + best-practices + SEO.
#
# Workflow séparé du CI critique pour ne pas bloquer Tests+Build.
# [S5-PERF] Depuis le 24/09/2026 : les 4 catégories sont des budgets bloquants (« error »), figés sur la
# mesure CI du jour (perf 0,97 → seuil 0,90 pour absorber le bruit ; accessibilité, bonnes pratiques et SEO à 1).
#
# Résultats : artefact .html téléchargeable + lien temporary-public-storage.

name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git
          # du runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris
          # une action tierce, peut le lire. Ce job ne pousse rien, donc il n'en a pas besoin.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      # [S5-CI-ALLEGEE] Construction directe (sans le prebuild qui relançait tout le lint : la CI s'en charge).
      - name: Build
        run: npx --no-install vite build --mode production

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        # [S5-PERF] Budgets FIGÉS (24/09/2026, décision de Marc « mesurer puis figer ») : plus de
        # continue-on-error — un recul sous les seuils de .lighthouserc.json fait échouer le job.
