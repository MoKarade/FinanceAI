# .sonarcloud.properties — ce que SonarCloud doit considérer comme des TESTS.
#
# ══ POURQUOI CE FICHIER EXISTE ══════════════════════════════════════════════════════
#
# SonarCloud levait 19 `typescript:S2187` BLOCKER — « Add some tests to this file or
# delete it » — sur les 19 `mcp/tools/*.spec.ts`. Mesuré le 18/09 : ces fichiers
# contiennent ZÉRO test. Ce ne sont pas des tests vides, ce sont des SCHÉMAS d'outil MCP
# (`satisfies ReadToolSpec/WriteToolSpec`), browser-safe, consommés par l'app — la
# convention est écrite dans `docs/CONVENTIONS.md` sous `[ARCH-AITOOLS-SPLIT]` (ADR-1),
# et `vitest.config.ts` ne collecte QUE `tests/**/*.test.{ts,tsx}`.
#
# La racine n'est donc pas « Sonar se trompe » : c'est que `.spec.ts` a DEUX sens dans ce
# dépôt — vrais tests Playwright dans `e2e/`, schémas d'outil dans `mcp/tools/`. La
# détection automatique de SonarCloud range tout `**/*.spec.ts` du côté des tests, et
# `S2187` ne s'applique qu'aux fichiers de test.
#
# Déclarer `sonar.tests` explicitement retire l'ambiguïté sans renommer un seul fichier.
# Arbitrage de Marc, 18/09 : configurer plutôt que renommer — 19 fichiers et 43 imports
# réécrits sur un dépôt money-critical, pour zéro changement de comportement, ne valent
# pas le risque, et la convention écrite reste vraie.
#
# ⚠️⚠️ CE QUE JE N'AI PAS PU VÉRIFIER, ET C'EST À MESURER
#
# Aucun workflow de ce dépôt ne lance sonar (vérifié : `grep -rln sonar .github/workflows`
# ne rend rien), donc l'analyse est l'AUTOMATIQUE de SonarCloud — celle qui lit
# `.sonarcloud.properties`, et NON `sonar-project.properties` (ce dernier est lu par le
# scanner CLI / une analyse lancée en CI). Se tromper de nom produit un fichier qui ne
# fait RIEN, en silence : exactement la classe de compteur creux que l'audit du 18/09 a
# attrapée trois fois.
#
# LA PREUVE EST DONC AILLEURS QUE DANS CE COMMIT : les 19 `S2187` doivent DISPARAÎTRE du
# tableau SonarCloud à la prochaine analyse. Tant que personne ne l'a constaté, ce fichier
# est une hypothèse, pas un correctif. Si les 19 sont toujours là, le nom du fichier est
# le premier suspect.
#
# ⚠️ Effet de bord ASSUMÉ : en cessant d'être des tests, les `mcp/tools/*.spec.ts`
# deviennent du code SOURCE aux yeux de Sonar. De nouveaux signalements peuvent y
# apparaître — ils seront alors réels, et c'est ce qu'on veut.

# Les seuls vrais tests : la suite vitest et les scénarios Playwright.
sonar.tests=tests,e2e
