<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceAI - Gestion Financière</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2310b981%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 font-family=%22Arial, sans-serif%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>Fi</text></svg>">

    <!-- P2.9 PWA — manifest + theme color pour install prompts mobiles -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <!-- mobile-web-app-capable : standard (remplace le apple- déprécié). On garde
         le apple- pour la rétro-compat iOS Safari. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Sprint 2 PL1 — preload du weight 400 d'Outfit (le plus utilisé) pour
         économiser ~100ms LCP. Le navigateur découvre la fonte avant de parser
         le CSS Google Fonts. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="https://fonts.gstatic.com/s/outfit/v11/QGYvz_MVcBeNP4NJtEtq.woff2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/index.css">
    <!-- CSP for GitHub Pages (Netlify headers don't apply on GH Pages). -->
    <!-- Keep in sync with netlify.toml [[headers]] Content-Security-Policy. -->
    <!-- Sprint 3 SH2 (sécurité) — `unsafe-inline` retiré de script-src.
         Possible maintenant car ga-init.js est externalisé dans /public et
         tous les scripts inline ont été migrés. CSP est aligné avec netlify.toml. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.anthropic.com https://finnhub.io https://api.coingecko.com https://www.bankofcanada.ca https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://cloudflareinsights.com; worker-src 'self' blob:;">

    <!-- Permissions-Policy : aligné avec netlify.toml [[headers]] pour les
         hébergeurs qui ne lisent pas les headers HTTP (ex: GitHub Pages). -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

    <!-- Google Analytics 4 — Measurement ID G-5WLQGBF1VL -->
    <!-- Tag chargé async (non-bloquant). Code d'init externalisé dans /ga-init.js pour respecter la CSP stricte (pas d'unsafe-inline dans netlify.toml script-src). -->
    <!-- S-E : pas de SRI (integrity=) sur gtag.js — Google fait tourner ce fichier ;
         un hash figé casserait GA à chaque rotation (Google ne supporte pas SRI ici).
         La protection d'un script tiers non-épinglable est l'allow-list d'origine via
         CSP (script-src googletagmanager.com), déjà en place dans netlify.toml.
         + Consent Mode v2 (ga-init.js) : aucun stockage analytics avant consentement. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5WLQGBF1VL"></script>
    <script src="/ga-init.js"></script>
  </head>
  <body>
    <div class="aurora-bg">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
