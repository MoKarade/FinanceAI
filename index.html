
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceAI - Gestion Financière</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2310b981%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 font-family=%22Arial, sans-serif%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>Fi</text></svg>">
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: '#10b981', // Emerald 500
              secondary: '#8b5cf6', // Violet 500
              // NEW PALETTE
              dark: '#0B0E14',      // Deep Midnight (Background)
              surface: '#151922',   // Card Background
              surfaceHighlight: '#1E2330', // Hover state
              border: 'rgba(255, 255, 255, 0.06)',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 15s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(15px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -40px) scale(1.05)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        },
        darkMode: 'class'
      }
    </script>
    <style>
      body {
        background-color: #0B0E14; /* Deep Midnight */
        color: #e2e8f0; /* Slate 200 - Softer than pure white */
        overflow-x: hidden;
        font-family: 'Outfit', sans-serif;
      }
      
      /* Aurora Background - Adjusted for lighter dark theme */
      .aurora-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(circle at top left, #1a1e29 0%, #0B0E14 40%);
      }
      
      .aurora-blob {
        position: absolute;
        filter: blur(90px);
        opacity: 0.25; /* Reduced opacity for subtlety */
        animation: blob 20s infinite alternate;
        border-radius: 50%;
        mix-blend-mode: screen;
      }
      
      .blob-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: #10b981; animation-delay: 0s; opacity: 0.15; }
      .blob-2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: #8b5cf6; animation-delay: 4s; opacity: 0.15; }
      .blob-3 { top: 30%; left: 30%; width: 40vw; height: 40vw; background: #3b82f6; animation-delay: 8s; opacity: 0.1; }

      /* Premium Glassmorphism - Lighter, smoother */
      .glass-panel {
        background: rgba(21, 25, 34, 0.65); /* surface color with transparency */
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
      
      .glass-panel:hover {
        background: rgba(30, 35, 48, 0.75);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.2); 
      }
      
      /* Inputs */
      input, select, textarea {
        transition: all 0.2s ease;
        background-color: rgba(11, 14, 20, 0.6) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
      }
      input:focus, select:focus, textarea:focus {
        background-color: rgba(11, 14, 20, 0.9) !important;
        border-color: rgba(139, 92, 246, 0.4) !important;
        box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.1);
      }
      
      .privacy-blur {
         transition: filter 0.3s ease;
      }

    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="aurora-bg">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
