<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceAI - Gestion Financière</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2310b981%22 rx=%2220%22/><text x=%2250%22 y=%2265%22 font-family=%22Arial, sans-serif%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>Fi</text></svg>">

    <!-- P2.9 PWA — manifest + theme color pour install prompts mobiles -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <!-- mobile-web-app-capable : standard (remplace le apple- déprécié). On garde
         le apple- pour la rétro-compat iOS Safari. -->
    <meta name="description" content="FinanceAI — tableau de bord de finances personnelles (Québec/Canada) : budget, placements, impôts, projections.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- FONTS : auto-hébergées (@fontsource, importées par index.tsx) — [S5-PERF] 24/09/2026. -->

    <link rel="stylesheet" href="/index.css">
    <!-- CSP en <meta> : défense-en-profondeur (s'applique même si les headers HTTP manquent). -->
    <!-- Keep in sync with vercel.json [[headers]] Content-Security-Policy. -->
    <!-- [SEC-CSP-HEADER] `frame-ancestors` retiré ici : IGNORÉ en <meta> par spec (header-only) →
         livré via vercel.json (CSP HTTP + `X-Frame-Options: DENY`). Le garder en meta = warning console. -->
    <!-- Sprint 3 SH2 (sécurité) — `unsafe-inline` retiré de script-src (tous les scripts inline ont été
         migrés). [S5-SANS-GA] 24/09/2026 : Google Analytics / Tag Manager retirés (décision de Marc) —
         googletagmanager.com n'est plus autorisé (vecteur connu de contournement de CSP). Aligné avec vercel.json. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.anthropic.com https://finnhub.io https://api.coingecko.com https://www.bankofcanada.ca https://www.googleapis.com https://accounts.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com; base-uri 'self'; object-src 'none';">

    <!-- Permissions-Policy : aligné avec vercel.json [[headers]] pour les
         hébergeurs qui ne lisent pas les headers HTTP (ex: GitHub Pages). -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

  </head>
  <body>
    <div class="aurora-bg">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
