[build]
  command = "npm install --no-audit --no-fund && npm run typecheck && npm run test && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Phase 0: headers de securite
# Note: 'unsafe-inline' et 'unsafe-eval' encore necessaires a cause du
# runtime Tailwind CDN (cdn.tailwindcss.com). L'importmap esm.sh a ete
# retire (bug audit #3) : React / react-dom / Recharts / @google/genai
# sont maintenant bundles par Vite depuis les dependencies npm.
# A serrer completement en migrant Tailwind en build-time (Phase 4).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://generativelanguage.googleapis.com https://dev.lunchmoney.app https://www.bankofcanada.ca https://docs.google.com https://api.allorigins.win; frame-src 'self' https://cdn.plaid.com; worker-src 'self' blob:;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
