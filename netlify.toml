[build]
  command = "npm install --no-audit --no-fund && npm run typecheck && npm run test && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# CSP : script-src reduit a 'self' — plus d'unsafe-eval ni unsafe-inline
# depuis la migration Tailwind build-time (tailwindcss ^3.4 en devDeps).
# unsafe-inline reste dans style-src pour les inline styles React (style={{}})
# et les SVG styles generes par Recharts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://generativelanguage.googleapis.com https://dev.lunchmoney.app https://www.bankofcanada.ca https://docs.google.com https://api.allorigins.win; frame-src 'self' https://cdn.plaid.com; worker-src 'self' blob:;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
