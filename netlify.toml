[build]
  command = "npm install --no-audit --no-fund && npm run typecheck && npm run test && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# CSP : script-src reduit a 'self' — plus d'unsafe-eval ni unsafe-inline
# depuis la migration Tailwind build-time (tailwindcss ^3.4 en devDeps).
# unsafe-inline reste dans style-src pour les inline styles React (style={{}})
# et les SVG styles generes par Recharts.
# P1 — docs.google.com retiré du connect-src : Google Sheet legacy supprimé
# totalement (utilisateur ne veut plus de données factices au boot).
# 2026-05-21 — ajout Google Analytics 4 (G-5WLQGBF1VL) :
#   - script-src : googletagmanager.com (gtag.js)
#   - connect-src : *.google-analytics.com + *.analytics.google.com (hits + collect)
#   - img-src : 'https:' déjà ouvert couvre les pixels GA legacy
# Le code d'init est dans public/ga-init.js (externalisé, pas d'unsafe-inline).
[[headers]]
  for = "/*"
  [headers.values]
    # Sprint 3 SM3 (sécurité) — frame-src https://cdn.plaid.com retiré : aucun
    # usage de Plaid dans le code, c'était une fuite de surface d'attaque.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.anthropic.com https://api.era.app https://finnhub.io https://www.bankofcanada.ca https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://cloudflareinsights.com; worker-src 'self' blob:;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# P1 — Cache strategy. Évite "Failed to fetch dynamically imported module"
# (signalé par user sur hubperso.com après deploy). Le problème : navigateur
# garde un vieux index.html cached qui pointe vers des hashes de chunks qui
# n'existent plus sur le serveur après le nouveau build.
#
# Solution : forcer no-cache sur index.html (toujours frais), cache long sur
# les assets hashés (immutable car nouveau hash si contenu change).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
